name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_FEEDS:
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_FEEDS: ${{inputs.WRT_FEEDS}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dwarves clang llvm libbpf-dev libclang-dev zstd
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Machine Information
        run: |
          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/
          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Caches
        id: check-cache
        uses: actions/cache@main
        with:
          key: ${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            MISSING=""
            for T in sed patch tar zstd flock; do
              [ -x "./wrt/staging_dir/host/bin/$T" ] || MISSING="$MISSING $T"
            done

            if [ -n "$MISSING" ]; then
              echo "host tools missing:$MISSING -- treating cache as incomplete"
              rm -rf ./wrt/staging_dir/host
            fi

            TC_DIR=$(ls -d ./wrt/staging_dir/toolchain-* 2>/dev/null | head -n 1)
            if [ -z "$TC_DIR" ] || [ ! -f "$TC_DIR/stamp/.gcc_final_installed" ] ||
               ! ls "$TC_DIR"/lib/libgcc_s.so.* >/dev/null 2>&1; then
              echo "toolchain incomplete -- treating cache as incomplete"
              rm -rf ./wrt/staging_dir/toolchain-*
              TC_DIR=""
            fi

            if [ ! -d "./wrt/staging_dir/host" ] || [ -z "$TC_DIR" ]; then
              echo "staging dir incomplete, skip stamp touch"
            else
              find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
                find "$DIR" -type f -exec touch {} +
              done

              echo "toolchain skiped done!"
            fi

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Load Custom Feeds
        if: env.WRT_FEEDS == 'true'
        run: |

          chmod +x $GITHUB_WORKSPACE/Scripts/Feeds.sh
          $GITHUB_WORKSPACE/Scripts/Feeds.sh

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Settings
        run: |
          cd ./wrt/

          chmod +x $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Packages.sh

          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt > .config

          chmod +x $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

      - name: Initialization Honk Toolchain
        run: |
          cd ./wrt/

          if [ "$WRT_CONFIG" != "immortalwrt-x86" ]; then
            echo "honk toolchain is only wired for immortalwrt-x86, skip"
            exit 0
          fi

          RUST_STABLE="1.99.1"
          RUST_NIGHTLY="nightly-2026-10-20"
          BPF_LINKER_VERSION="0.11.0"
          BPF_LINKER_SHA256="10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450"

          echo "========== Install Rust =========="

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
          fi
          . "$HOME/.cargo/env"

          rustup toolchain install "$RUST_STABLE" --profile minimal \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal \
            --component rust-src --component llvm-tools
          rustup default "$RUST_STABLE"

          echo "========== Install bpf-linker =========="

          curl -fsSL --retry 3 -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"

          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum -c -

          sudo tar --zstd -xf /tmp/bpf-linker.tar.zst -C /usr/local/bin

          bpf-linker --version

          echo "========== Honk Toolchain Ready =========="

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Honk
        run: |
          cd ./wrt/

          if [ "$WRT_CONFIG" != "immortalwrt-x86" ]; then
            echo "honk is only wired for immortalwrt-x86, skip"
            exit 0
          fi

          make prepare -j$(nproc)

          TC_DIR=$(ls -d ./staging_dir/toolchain-* 2>/dev/null | head -n 1)
          if [ -z "$TC_DIR" ] || ! ls "$TC_DIR"/lib/libgcc_s.so.* >/dev/null 2>&1; then
            echo "ERROR: toolchain staging is incomplete after make prepare"
            ls -l ./staging_dir/toolchain-* 2>/dev/null || true
            exit 1
          fi

          make package/honk/compile V=s CONFIG_PACKAGE_vmlinux-btf=

      - name: Compile Firmware
        run: |
          cd ./wrt/

          LOG="$GITHUB_WORKSPACE/compile.log"
          set +e
          ( while sleep 60; do echo "building... $(wc -l < "$LOG") lines"; done ) &
          make -j$(nproc) > "$LOG" 2>&1 || make -j1 V=s >> "$LOG" 2>&1
          STATUS=$?
          kill $!

          if [ $STATUS -eq 0 ]; then echo "ok, $(wc -l < "$LOG") lines"; exit 0; fi
          tail -n 200 "$LOG"
          exit $STATUS

      - name: Upload Compile Log
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: compile-log-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          path: ./compile.log

      - name: Verify Honk
        run: |
          cd ./wrt/

          if [ "$WRT_CONFIG" != "immortalwrt-x86" ]; then
            echo "honk assertion only covers immortalwrt-x86 for now, skip"
            exit 0
          fi

          if ! grep -q '^CONFIG_PACKAGE_honk=y' .config; then
            echo "ERROR: honk was requested by $WRT_CONFIG but make defconfig dropped it (unsatisfied dependency?)"
            grep -E 'HONK|honk|vmlinux-btf' .config || true
            exit 1
          fi

          if ! find ./bin/targets/ -name '*.manifest' -exec grep -q '^honk - ' {} + ; then
            echo "ERROR: honk is selected but missing from the firmware manifest"
            exit 1
          fi
          echo "honk is in .config and in the firmware manifest"

      - name: Machine Space
        run: |
          cd ./wrt/

          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/

          mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_BRANCH"-"$WRT_DATE".txt

          echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
          echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

          find ./bin/targets/ -type f -name "*.apk" -exec rm -f {} +
          find ./bin/targets/ -type f -size -5M -delete
          find ./bin/targets/ -type f -printf '%f\n' | sort
          find ./bin/targets/ -type f -exec sh -c 'mv -f "$@" ./upload/' _ {} +

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
